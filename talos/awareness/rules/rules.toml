# Deterministic rule policy for the awareness subsystem (C7, Phase 4).
# Validated against talos/awareness/rules/policy.py; the version is recorded
# with every derived alert. "hard" rules take precedence over classification.

version = 2

# --- overflow: the canonical critical scenario -------------------------------

[[rules]]
id = "overflow-critical"
description = "Water overflow opens one critical incident and interrupts immediately"
kind = "hard"

[rules.match]
event_type = "plant.overflow.detected"

[[rules.match.conditions]]
field = "overflow"
op = "eq"
value = true

[rules.actions.alert]
alert_type = "overflow"
severity = "critical"
title = "Overflow detected: {entity_id}"
description = "Overflow reported by {source_id} (zone {payload.zone})."
deduplication_key = "overflow:{entity_id}"
recommended_actions = ["Stop the pump", "Check the affected pot"]

[rules.actions.attention]
priority = 1
interruptibility = "immediate"
reason = "Critical overflow at {entity_id}"
preferred_channel = "voice"
cooldown_key = "overflow:{entity_id}"
cooldown_seconds = 300
notify = true

# --- overflow cleared: deterministic auto-resolution -------------------------

[[rules]]
id = "overflow-resolved"
description = "An explicit all-clear resolves the overflow incident"
kind = "hard"

[rules.match]
event_type = "plant.overflow.detected"

[[rules.match.conditions]]
field = "overflow"
op = "eq"
value = false

[rules.actions.resolve]
deduplication_key = "overflow:{entity_id}"

# --- the agent's own failed work ---------------------------------------------
# Background work the user explicitly asked for, which then failed, is a fact
# about the world worth surfacing later -- not just a log line. Deliberately
# conservative: classification (never hard), warning severity, one item per
# job, next_interaction rather than an interruption, and an hour-long cooldown
# per session so a repeatedly failing job cannot become nagging. Failed *tool*
# calls (agent.tool.failed) are recorded as history but raise nothing: they
# are frequently retried and recovered from within the same turn.

[[rules]]
id = "agent-job-failed"
description = "A background job the user asked for failed; mention it next time we speak"
kind = "classification"

[rules.match]
event_type = "agent.job.failed"

[rules.actions.alert]
alert_type = "agent_job_failed"
severity = "warning"
title = "Background work failed"
description = "Job {payload.job_id} ({payload.source}) failed: {payload.error}"
deduplication_key = "agent_job_failed:{payload.job_id}"
recommended_actions = ["Ask the user whether to retry"]

[rules.actions.attention]
priority = 5
interruptibility = "next_interaction"
reason = "A background job failed: {payload.error}"
preferred_channel = "voice"
cooldown_key = "agent_job_failed:{payload.session_id}"
cooldown_seconds = 3600
notify = false

# --- worker-detected source silence ------------------------------------------

[source_offline]
enabled = true
severity = "warning"
# Sources of these registry types escalate to critical when silent:
critical_source_types = []

[source_offline.attention]
priority = 4
interruptibility = "next_interaction"
reason = "Source {source_id} is offline"
preferred_channel = "voice"
cooldown_key = "source_offline:{source_id}"
cooldown_seconds = 3600
notify = true
